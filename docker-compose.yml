services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sphere
      POSTGRES_USER: sphere
      POSTGRES_PASSWORD: sphere
    ports:
      - "5432:5432"
    volumes:
      - sphere-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphere -d sphere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sphere-postgres:
